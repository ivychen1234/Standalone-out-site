<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Full-Screen World Embed</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--bg:#05070d;--ctrl-bg:rgba(0,0,0,0.45);--ctrl-fg:#fff}
    html,body{height:100%;width:100%;margin:0;padding:0;background:var(--bg);}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .iframe-wrap{position:fixed;inset:0;width:100vw;height:100vh;background:var(--bg);}
    iframe{width:100%;height:100%;border:0;display:block;background:transparent}

    /* small overlay controls like the example site */
    .overlay{
      position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:60
    }
    .btn{background:var(--ctrl-bg);color:var(--ctrl-fg);padding:8px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:600}
    .btn a{color:inherit;text-decoration:none}
    .label{position:fixed;left:12px;top:12px;color:rgba(255,255,255,0.9);z-index:60;font-size:13px}

    /* responsive: hide label on very small screens */
    @media (max-width:420px){.label{display:none}}
  </style>
  <script>
    function enterFullscreen(){
      const el = document.getElementById('standalone-iframe');
      if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
      else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
    }
    function openInNew(){
      const url = document.getElementById('standalone-iframe').src; window.open(url,'_blank');
    }
    // Allow parent page to forward hash or query if needed
    function setSrc(url){ document.getElementById('standalone-iframe').src = url }
  </script>
</head>
<body>
  <div class="label">Embedded world</div>
  <div class="overlay">
    <button class="btn" onclick="openInNew()">Open in new tab</button>
    <button class="btn" onclick="enterFullscreen()">Enter Fullscreen</button>
  </div>

  <div class="iframe-wrap">
    <iframe
      id="standalone-iframe"
      title="Embedded Content"
      class="z-10 size-full border-none bg-transparent"
      src="https://worlds-dev.viverse.com/zh-TW/TJsFrUY"
      sandbox="allow-modals allow-popups allow-top-navigation allow-pointer-lock allow-orientation-lock allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-same-origin allow-scripts allow-forms"
      allow="xr-spatial-tracking; autoplay; encrypted-media; fullscreen; picture-in-picture; web-share; cross-origin-isolated"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

</body>
</html>
